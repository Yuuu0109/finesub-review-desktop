name: Windows native desktop build

on:
  workflow_dispatch:
  push:
    branches: [main, feat/desktop, codex/native-mygo]
    tags: ["desktop-v*"]
    paths:
      - "desktop/**"
      - "scripts/package_desktop.mjs"
      - "scripts/verify_desktop.mjs"
      - "scripts/desktop_release.test.mjs"
      - "CHANGELOG.md"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "scripts/package_desktop.mjs"
      - "scripts/verify_desktop.mjs"
      - "scripts/desktop_release.test.mjs"
      - "CHANGELOG.md"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto

jobs:
  windows:
    runs-on: windows-latest
    env:
      SIGN_RELEASE: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: desktop/go.sum
      - name: Normalize native source for review
        working-directory: desktop
        shell: pwsh
        run: |
          go mod tidy
          gofmt -w .
          python -c "import pathlib,json,zlib,base64; p=pathlib.Path('.'); files={str(f).replace(chr(92),'/'):f.read_text(encoding='utf-8') for f in p.rglob('*.go')}; files.update({n:(p/n).read_text(encoding='utf-8') for n in ['go.mod','go.sum']}); print('FORMATTED_SOURCE='+base64.b64encode(zlib.compress(json.dumps(files,ensure_ascii=False).encode('utf-8'))).decode())"
      - name: Go tests
        working-directory: desktop
        run: go test -v ./...
      # A clean checkout builds without Vite, Node, copied pages or WebView2.
      # This verifies compilation only; Windows UI and upgrade acceptance are
      # separate checks recorded in VALIDATION.md.
      - name: Build the native executable
        working-directory: desktop
        run: go build -trimpath -ldflags "-H=windowsgui" -o "FineSub Review-dev.exe" .
      - name: Verify executable version without opening a window
        working-directory: desktop
        shell: pwsh
        run: |
          $expected = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          $actual = (& ".\FineSub Review-dev.exe" --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) {
            throw "Executable version '$actual' does not match '$expected'"
          }
      - name: Upload development executable
        if: env.SIGN_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: finesub-review-native-windows-dev
          path: desktop/FineSub Review-dev.exe
          if-no-files-found: error
      - name: Install the MyGO CLI
        if: env.SIGN_RELEASE == 'true'
        run: go install github.com/egoist/mygo/cmd/mygo@v0.7.1
      - name: Build the signed release
        if: env.SIGN_RELEASE == 'true'
        working-directory: desktop
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: mygo build
      # Node is only used for these release validation/staging utilities.
      # The desktop app and its Go build have no JavaScript runtime dependency.
      - uses: actions/setup-node@v4
        if: env.SIGN_RELEASE == 'true'
        with:
          node-version: 22
      - name: Test release verification and staging
        if: env.SIGN_RELEASE == 'true'
        run: node scripts/desktop_release.test.mjs
      - name: Verify signature, checksums and native executable
        if: env.SIGN_RELEASE == 'true'
        run: node scripts/verify_desktop.mjs
      - name: Stage the release artifacts
        if: env.SIGN_RELEASE == 'true'
        run: node scripts/package_desktop.mjs
      - name: Upload release artifacts
        if: env.SIGN_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: finesub-review-native-windows
          path: output/desktop-*/
          if-no-files-found: error
      # Publishing a Release is a separate action after real-machine acceptance.

