name: Windows desktop build
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Build and publish a signed desktop release
        type: boolean
        default: false
  push:
    branches: [main, feat/desktop]
    tags: ['desktop-v*']
    paths:
      - 'frontend/**'
      - 'desktop/**'
      - 'scripts/**desktop*'
      - 'scripts/embed_frontend.mjs'
      - 'scripts/release_config.mjs'
      - 'scripts/release_config.test.mjs'
      - 'CHANGELOG.md'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'desktop/**'
      - 'scripts/**desktop*'
      - 'scripts/embed_frontend.mjs'
      - 'scripts/release_config.mjs'
      - 'scripts/release_config.test.mjs'
      - 'CHANGELOG.md'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
env:
  GOTOOLCHAIN: auto
jobs:
  windows:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
    env:
      SIGNED_RELEASE: ${{ startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Validate release versions and tag
        id: metadata
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node --test scripts/release_config.test.mjs
          node scripts/release_config.mjs
      - name: Check release signing key
        if: env.SIGNED_RELEASE == 'true'
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if (-not $env:MYGO_UPDATER_PRIVATE_KEY) { throw 'Set MYGO_UPDATER_PRIVATE_KEY to the existing signing key before publishing.' }
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: desktop/go.sum
      - name: Frontend install and tests
        working-directory: frontend
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm install --frozen-lockfile
          pnpm test:desktop
          pnpm build
      - name: Browser interaction checks
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm install --prefix "$env:RUNNER_TEMP/ui-check" --no-package-lock playwright@1.58.2
          node "$env:RUNNER_TEMP/ui-check/node_modules/playwright/cli.js" install chromium
          $env:PLAYWRIGHT_MODULE = "$env:RUNNER_TEMP/ui-check/node_modules/playwright"
          node scripts/verify_desktop_ui.mjs
      - name: Embed the frontend into the Go shell
        run: node scripts/embed_frontend.mjs
      - name: Go tests
        working-directory: desktop
        run: go test -v ./...
      - name: Build the development executable
        if: env.SIGNED_RELEASE != 'true'
        working-directory: desktop
        run: go build -trimpath -o finesub-review-desktop.exe .
      - name: Install the mygo CLI
        if: env.SIGNED_RELEASE == 'true'
        run: go install github.com/egoist/mygo/cmd/mygo@v0.7.1
      - name: Build the signed release
        if: env.SIGNED_RELEASE == 'true'
        working-directory: desktop
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: mygo build
      - name: Verify signature, checksums and the portable executable
        if: env.SIGNED_RELEASE == 'true'
        run: node scripts/verify_desktop.mjs
      - name: Stage the release artifacts
        if: env.SIGNED_RELEASE == 'true'
        run: node scripts/package_desktop.mjs
      - uses: actions/upload-artifact@v4
        if: env.SIGNED_RELEASE == 'true'
        with:
          name: finesub-review-windows
          path: |
            output/desktop-*/
            release-notes.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-ui-evidence
          path: |
            test-results/desktop-ui-*/
            frontend/dist/
          if-no-files-found: ignore
  publish:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: finesub-review-windows
          path: release
      # Upload into a draft first. Clients must never see a partially uploaded feed.
      # Existing releases are deliberately not overwritten by reruns.
      - name: Publish the verified update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.windows.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --draft --target "$RELEASE_COMMIT" --title "FineSub Review ${RELEASE_TAG#desktop-v}" --notes-file release/release-notes.txt
          gh release upload "$RELEASE_TAG" release/output/desktop-*/*
          flags=(--draft=false --latest=false)
          if [[ "${RELEASE_TAG#desktop-v}" == *-* ]]; then flags+=(--prerelease); fi
          gh release edit "$RELEASE_TAG" "${flags[@]}"
