name: Windows desktop build
on:
  workflow_dispatch:
  push:
    branches: [main, feat/desktop]
    paths:
      - "frontend/**"
      - "desktop/**"
      - "scripts/embed_frontend.mjs"
      - "scripts/package_desktop.mjs"
      - "scripts/verify_desktop.mjs"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "desktop/**"
      - "scripts/embed_frontend.mjs"
      - "scripts/package_desktop.mjs"
      - "scripts/verify_desktop.mjs"
      - ".github/workflows/desktop.yml"
permissions:
  contents: read
env:
  # MyGo 0.7.1 declares `go 1.27.3` in its go.mod; auto fetches that toolchain
  # when the runner's Go is older.
  GOTOOLCHAIN: auto
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: desktop/go.sum
      - name: Frontend install and tests
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test:desktop
          pnpm build
      # The shell serves its own pages through a mygo:// handler so it can attach
      # the Content-Security-Policy, so the pages must be embedded in the binary.
      # Without this step a clean checkout builds an executable that fails at
      # launch with "找不到前端" as soon as it is copied away from the repository.
      - name: Embed the frontend into the Go shell
        run: node scripts/embed_frontend.mjs
      - name: Go tests
        working-directory: desktop
        run: go test -v ./...
      # Only on a pull request. There it is what proves the whole chain a
      # contributor gets — embed_frontend.mjs, then a plain go build with no
      # update key — still compiles and produces a working layout. A push builds
      # the signed release below with `mygo build`, which is the artifact every
      # check runs against, so a second go build there would build a binary
      # nothing looks at.
      - name: Build the desktop executable (pull requests only)
        if: github.event_name == 'pull_request'
        working-directory: desktop
        run: go build -trimpath -o finesub-review-desktop.exe .
      - name: Install the mygo CLI
        if: github.event_name != 'pull_request'
        run: go install github.com/egoist/mygo/cmd/mygo@v0.7.1
      # A release build stamps the update feed and public key into the binary and
      # signs the archives. A pull request has no key, so it stops at go build.
      - name: Build the signed release
        if: github.event_name != 'pull_request'
        working-directory: desktop
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: mygo build
      - name: Verify signature, checksums and the portable executable
        if: github.event_name != 'pull_request'
        run: node scripts/verify_desktop.mjs
      - name: Stage the release artifacts
        if: github.event_name != 'pull_request'
        run: node scripts/package_desktop.mjs
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: finesub-review-windows
          path: output/desktop-*/
          if-no-files-found: error
